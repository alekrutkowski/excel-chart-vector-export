name: Bug report
description: Report a problem with Excel chart extraction
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please do not attach confidential workbooks or license files.
  - type: input
    id: version
    attributes:
      label: Tool version
      placeholder: '1.3.1'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, Excel version if using native Excel, and optional Inkscape version.
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options: [excel, aspose, auto]
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Format
      options: [svg, emf, both]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command line, sanitized error and relevant manifest entries.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
